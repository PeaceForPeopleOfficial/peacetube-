<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeaceTube - মানসিক প্রশান্তির ভিডিও ও মিডিয়া প্ল্যাটফর্ম</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        :root {
            --orange: #ff9933;
            --green: #138808;
            --bg-gradient: linear-gradient(135deg, #e3f2fd 0%, #f1f8e9 100%);
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #eee;
        }
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1e272c 0%, #0f1416 100%);
            --card-bg: #263238;
            --text-color: #eceff1;
            --border-color: #37474f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 800px; margin: auto; }
        .nav-links { margin-bottom: 20px; font-weight: bold; }
        .nav-links a { text-decoration: none; color: var(--green); margin-right: 15px; }
        .search-box { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        .category-filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .category-btn { background: #fff; border: 1px solid #ccc; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .category-btn.active, .category-btn:hover { background: var(--green); color: #fff; border-color: var(--green); }
        .video-card { background: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border-color); }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-top: 10px; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        h3 { margin-top: 0; color: var(--text-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-links">
        <a href="index.html">🏠 হোম</a>
        <a href="video.html">📺 পিস টিউব</a>
    </div>

    <h2>📺 Peace Tube - শান্তিময় ভিডিও সংগ্রহ</h2>

    <!-- সার্চ করার বক্স -->
    <input type="text" id="videoSearch" class="search-box" placeholder="🔍 আপনার পছন্দের শান্তিময় ভিডিও বা মিউজিক খুঁজুন..." onkeyup="filterVideos()">

    <!-- ক্যাটাগরি ফিল্টার বাটনসমূহ -->
    <div class="category-filters">
        <button class="category-btn active" onclick="filterByCategory('all', this)">সব ভিডিও</button>
        <button class="category-btn" onclick="filterByCategory('nature', this)">প্রকৃতির সুর</button>
        <button class="category-btn" onclick="filterByCategory('meditation', this)">মেডিটেশন</button>
        <button class="category-btn" onclick="filterByCategory('islamic', this)">ইসলামিক মিউজিক</button>
    </div>

    <!-- অ্যাডমিন প্যানেল থেকে আসা ভিডিওগুলো এখানে লোড হবে -->
    <div id="dynamic-videos-container">
        <p>🔄 ভিডিও লোড হচ্ছে...</p>
    </div>
</div>

<script>
    let allVideosData = [];
    let currentCategory = 'all';

    async function loadDynamicVideos() {
        try {
            const response = await fetch('https://api.github.com/repos/PeaceForPeopleOfficial/peacetube-/contents/content/videos');
            const files = await response.json();

            const videoContainer = document.getElementById('dynamic-videos-container');
            videoContainer.innerHTML = '';
            allVideosData = [];

            for (const file of files) {
                if (file.name.endsWith('.json')) {
                    const fileRes = await fetch(file.download_url);
                    const videoData = await fileRes.json();
                    allVideosData.push(videoData);
                }
            }

            displayVideos(allVideosData);
        } catch (error) {
            console.error('ভিডিও লোড করতে সমস্যা হচ্ছে:', error);
            document.getElementById('dynamic-videos-container').innerHTML = '<p style="color:red;">ভিডিও লোড করতে সমস্যা হয়েছে।</p>';
        }
    }

    function displayVideos(videos) {
        const videoContainer = document.getElementById('dynamic-videos-container');
        videoContainer.innerHTML = '';

        if (videos.length === 0) {
            videoContainer.innerHTML = '<p>দুঃখিত, এই মুহূর্তে কোনো ভিডিও পাওয়া যায়নি।</p>';
            return;
        }

        videos.forEach(videoData => {
            const videoCard = document.createElement('div');
            videoCard.className = 'video-card';
            
            const youtubeUrl = videoData.video_url || videoData.url || '';
            const youtubeId = extractYouTubeId(youtubeUrl);
            
            videoCard.innerHTML = `
                <h3>📺 ${videoData.title || 'শান্তিময় ভিডিও'}</h3>
                <p>${videoData.description || ''}</p>
                ${youtubeId ? `
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/${youtubeId}" title="YouTube video player" frameborder="0" allowfullscreen></iframe>
                </div>` : '<p style="color:red;">ভিডিও লিংক সঠিক নয়</p>'}
            `;
            videoContainer.appendChild(videoCard);
        });
    }

    // সার্চ এবং ক্যাটাগরি ফিল্টার একত্রে কাজ করার ফাংশন
    function filterVideos() {
        const query = document.getElementById('videoSearch').value.toLowerCase();
        
        const filtered = allVideosData.filter(video => {
            const title = (video.title || '').toLowerCase();
            const desc = (video.description || '').toLowerCase();
            const category = (video.category || '').toLowerCase();
            
            const matchesSearch = title.includes(query) || desc.includes(query);
            const matchesCategory = (currentCategory === 'all') || category.includes(currentCategory);

            return matchesSearch && matchesCategory;
        });

        displayVideos(filtered);
    }

    // ক্যাটাগরি সিলেক্ট করার ফাংশন
    function filterByCategory(category, btnElement) {
        currentCategory = category;
        
        // বাটনের অ্যাক্টিভ ক্লাস পরিবর্তন
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        filterVideos();
    }

    // ইউটিউব আইডি বের করার ফাংশন
    function extractYouTubeId(url) {
        if (!url) return '';
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : '';
    }

    document.addEventListener('DOMContentLoaded', loadDynamicVideos);
</script>

</body>
</html>

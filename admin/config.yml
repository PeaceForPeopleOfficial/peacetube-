backend:
  name: github
  repo: PeaceForPeopleOfficial/peacetube-
  branch: main
  base_url: https://decap-cms-oauth.vercel.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "audio"
    label: "🎙️ Podcasts & Audio Talks"
    folder: "content/audio"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title / শিরোনাম", name: "title", widget: "string" }
      - { label: "Speaker or Reciter / বক্তা বা ক্বারী", name: "artist", widget: "string", required: false }
      - { label: "Category / ক্যাটাগরি", name: "category", widget: "select", options: ["podcast_talk", "islamic_bayan", "quran_recitation"] }
      - { label: "Audio File / এমপিথ্রি ফাইল", name: "audio_file", widget: "file", required: false }
      - { label: "Audio URL / অনলাইন লিংক", name: "audio_url", widget: "string", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }

  - name: "videos"
    label: "Video Content"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Video Title", name: "title", widget: "string" }
      - { label: "YouTube Link", name: "link", widget: "string", required: false }
      - { label: "Video File", name: "video_file", widget: "file", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["official", "premium", "motivational", "visual", "islamic", "music"] }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Is Premium", name: "is_premium", widget: "boolean", default: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }

  - name: "daily_bani"
    label: "Daily Quotes"
    folder: "content/bani"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Quote Text"
        name: "quote"
        widget: "text"
      - label: "Author"
        name: "author"
        widget: "string"
        default: "Peace for People"
      - label: "Date"
        name: "date"
        widget: "date"

  - name: "library"
    label: "📖 E-Books, Poetry & Gojol"
    folder: "content/library"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title / বই বা রচনার নাম", name: "title", widget: "string" }
      - { label: "Author or Artist / লেখক বা শিল্পী", name: "author", widget: "string" }
      - { label: "Category / ক্যাটাগরি", name: "category", widget: "select", options: ["ebook", "islamic_gojol", "poem_shairy"] }
      - { label: "File Upload / ফাইল আপলোড (PDF বা MP3)", name: "file", widget: "file", required: false }
      - { label: "Description / বিবরণ", name: "description", widget: "text" }
      - { label: "Publish Date", name: "date", widget: "datetime" }

  - name: "confessions"
    label: "Heartfelt Notes"
    folder: "content/confessions"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Nickname", name: "title", widget: "string", default: "শান্ত মন" }
      - { label: "Message", name: "message", widget: "text" }
      - { label: "Admin Reply", name: "reply", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "datetime" }

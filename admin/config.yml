backend:
  name: github
  repo: PeaceForPeopleOfficial/peacetube-
  branch: main
  base_url: https://decap-cms-oauth.vercel.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "audio"
    label: "Audio Recitations"
    folder: "content/audio"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Artist", name: "artist", widget: "string", required: false }
      - { label: "Audio File", name: "audio_file", widget: "file", required: false }
      - { label: "Audio URL", name: "audio_url", widget: "string", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }

  - name: "videos"
    label: "Video Content"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Video Title", name: "title", widget: "string" }
      - { label: "YouTube Link", name: "link", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["official", "premium", "motivational", "visual", "islamic", "music"] }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Is Premium", name: "is_premium", widget: "boolean", default: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }

  - name: "daily_bani"
    label: "Daily Quotes"
    folder: "content/bani"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Quote Text"
        name: "quote"
        widget: "text"
      - label: "Author"
        name: "author"
        widget: "string"
        default: "Peace for People"
      - label: "Date"
        name: "date"
        widget: "date"

  - name: "confessions"
    label: "Heartfelt Notes"
    folder: "content/confessions"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Nickname", name: "title", widget: "string", default: "শান্ত মন" }
      - { label: "Message", name: "message", widget: "text" }
      - { label: "Admin Reply", name: "reply", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "datetime" }

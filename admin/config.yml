backend:
  name: github
  repo: PeaceForPeopleOfficial/peacetube-
  branch: main
  base_url: https://decap-cms-oauth.vercel.app

media_folder: "images"
public_folder: "/images"
collections:
  - name: "audio"
    label: "Audio Recitations"
    folder: "content/audio"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title / শিরোনাম", name: "title", widget: "string" }
      - { label: "Reciter / ক্বারী বা শিল্পীর নাম", name: "artist", widget: "string", required: false }
      - { label: "Audio File / MP3 ফাইল আপলোড", name: "audio_file", widget: "file", required: false }
      - { label: "Audio URL / অনলাইন এমপিথ্রি লিংক (বিকল্প)", name: "audio_url", widget: "string", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }

  - name: "videos"
    label: "Video Content"
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Video Title"
        name: "title"
        widget: "string"
      - label: "YouTube Video Link / Embed URL"
        name: "link"
        widget: "string"
        hint: "ইউটিউব ভিডিও বা এমবেড লিংক বসান"
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "nature"
          - "meditation"
          - "premium"
        default: "nature"
      - label: "Description"
        name: "description"
        widget: "text"
        required: false
      - label: "Is Premium Video?"
        name: "is_premium"
        widget: "boolean"
        default: false
      - label: "Publish Date"
        name: "date"
        widget: "datetime"

  - name: "daily_bani"
    label: "Daily Quotes & Bani"
    folder: "content/bani"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Quote / Bani Text"
        name: "quote"
        widget: "text"
      - label: "Author / Source"
        name: "author"
        widget: "string"
        default: "Peace for People"
      - label: "Date"
        name: "date"
        widget: "date"
